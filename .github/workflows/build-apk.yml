name: Build FasoTask APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraire FasoTask
        run: |
          mkdir project
          unzip -q FasoTask-V1-complete.zip -d project

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'application Android
        run: |
          gradle -p project/android assembleDebug --no-daemon

      - name: Préparer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FasoTask-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
